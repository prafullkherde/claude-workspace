spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tododb}
    username: ${DB_USER:todo}
    password: ${DB_PASS:todo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:a-very-long-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}
    expiration: 86400000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.todo: DEBUG
    org.springframework.security: INFO
